{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}Blogg - Register{% endblock %}

{% block page_content %}
<div class="container">
    <div class="row">
        <div class="col-md-4 col-md-offset-4">
            <h2 class="text-center">Register</h2>
            <div class="well">
                {{ wtf.quick_form(form, button_map={"submit": "btn btn-primary btn-block"}) }}
            </div>
            <p class="text-center">
                Have an account?
                <a href="{{ url_for('auth.login') }}">Click here to login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
