{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}Blogg - Password Reset{% endblock %}

{% block page_content %}
<div class="container">
    <div class="row">
        <div class="col-md-4 col-md-offset-4">
            <h2 class="text-center">Reset Your Password</h2>
            <div class="well">
                {{ wtf.quick_form(form, button_map={"submit": "btn btn-primary btn-block"}) }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
