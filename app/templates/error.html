{% extends "base.html" %}

{% block title %}Blogg - {{ title }}{% endblock %}

{% block page_content %}
<div class="error-card">
    <div class="error-code">{{ code }}</div>
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
    <p><a class="btn btn-primary" href="{{ url_for('main.index') }}">Go back to Home</a></p>
</div>
{% endblock %}
