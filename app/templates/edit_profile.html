<style>
    .edit-profile-container {
      max-width: 500px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }
  
    .edit-profile-header {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
      text-align: center;
    }
  
    .edit-profile-form {
      padding: 10px;
    }
  
    .form-control {
      border-radius: 5px;
    }
  
    .btn-primary {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
  
  {% extends "base.html" %}
  {% import "bootstrap/wtf.html" as wtf %}
  
  {% block title %}Blogg - Edit Profile{% endblock %}
  
  {% block page_content %}
  <div class="container d-flex justify-content-center">
      <div class="edit-profile-container">
          <div class="edit-profile-header">
              Edit Your Profile
          </div>
          <div class="edit-profile-form">
              {{ wtf.quick_form(form, button_map={'submit': 'primary'}) }}
          </div>
      </div>
  </div>
  {% endblock %}
