[project]
name = "blogg"
version = "0.1.0"
description = "A full-featured blogging and social networking web application built with Flask and SQLAlchemy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15.1",
    "bleach>=6.2.0",
    "blinker>=1.9.0",
    "click>=8.1.8",
    "email-validator>=2.2.0",
    "faker>=37.1.0",
    "flask>=3.1.0",
    "flask-bootstrap>=3.3.7.1",
    "flask-limiter>=3.12.0",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-migrate>=4.1.0",
    "flask-moment>=1.0.6",
    "flask-pagedown>=0.4.0",
    "flask-session>=0.8.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown>=3.7",
    "markupsafe>=3.0.2",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.39",
    "werkzeug>=3.1.3",
    "wtforms>=3.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
